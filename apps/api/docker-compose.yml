# Local PostgreSQL for development (database "grandlivre") and tests (database "grandlivre_test")
name: grandlivre

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: grandlivre
      POSTGRES_PASSWORD: grandlivre
      POSTGRES_DB: grandlivre
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grandlivre -d grandlivre"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
